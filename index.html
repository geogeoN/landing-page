<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <script src="https://kit.fontawesome.com/b84b868441.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="head">
            <div class="head-title">Our Awesome Team</div>
            <div class="head-text">
                <p>We have created a new product that will help designers, developers and companies create websites for their startups quickly and easily.</p>
            </div>
            <button class="head-btn">Enjoy Our Team</button>
        </div>
        <div class="members">
            <div class="member">
                <div class="info">
                    <div class="member-image">
                        <img src="img/vanessa.jpg" alt="Vanessa Laird: UI Designer">
                    </div>
                    <div class="personal-info">
                        <div class="name">Vanessa Laird</div>
                        <div class="post">UI DESIGNER</div>
                    </div>
                </div>
                <div class="socials">
                    <div class="icon"><i class="fa-brands fa-twitter"></i></div>
                    <div class="icon"><i class="fa-brands fa-facebook-square"></i></div>
                    <div class="icon"><i class="fa-brands fa-dribbble"></i></div>
                </div>
            </div>
            <div class="member">
                <div class="info">
                    <div class="member-image">
                        <img src="img/mason.jpg" alt="Mason Campbell: UI Designer">
                    </div>
                    <div class="personal-info">
                        <div class="name">Mason Campbell</div>
                        <div class="post">UI DESIGNER</div>
                    </div>
                </div>
                <div class="socials">
                    <div class="icon"><i class="fa-brands fa-twitter"></i></div>
                    <div class="icon"><i class="fa-brands fa-facebook-square"></i></div>
                    <div class="icon"><i class="fa-brands fa-dribbble"></i></div>
                </div>
            </div>
            <div class="member">
                <div class="info">
                    <div class="member-image">
                        <img src="img/irea.jpg" alt="Irea Evans: Client Manager">
                    </div>
                    <div class="personal-info">
                        <div class="name">Irea Evans</div>
                        <div class="post">CLIENT MANAGER</div>
                    </div>
                </div>
                <div class="socials">
                    <div class="icon"><i class="fa-brands fa-twitter"></i></div>
                    <div class="icon"><i class="fa-brands fa-facebook-square"></i></div>
                    <div class="icon"><i class="fa-brands fa-dribbble"></i></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
